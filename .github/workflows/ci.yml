name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build and test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Placeholder for the speech model
        # The model (~570 MB) is downloaded at build time and kept out of git.
        # Tauri's bundle config needs at least one file in this folder to compile;
        # the end-to-end test skips itself when the real model is absent.
        run: mkdir -p src-tauri/resources/models && touch src-tauri/resources/models/placeholder.txt

      - name: Run tests
        working-directory: src-tauri
        run: cargo test --release
